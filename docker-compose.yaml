version: "3"

services:
  postgres:
    build: .
    ports:
      - "5435:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    environment:
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: Code@Labs
      POSTGRES_DB: classroom_embeding
